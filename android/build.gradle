allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def forcedCompileSdk = 36

def configureAndroidProject = { project ->
    project.extensions.configure("android") { androidExt ->
        if (androidExt.hasProperty("compileSdk")) {
            androidExt.compileSdk = forcedCompileSdk
        } else if (androidExt.metaClass.respondsTo(androidExt, "compileSdkVersion", Integer)) {
            androidExt.compileSdkVersion(forcedCompileSdk)
        }
        if (androidExt.hasProperty("namespace") && androidExt.namespace == null) {
            androidExt.namespace = project.group
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    def androidProject = project
    pluginManager.withPlugin("com.android.application") {
        configureAndroidProject(androidProject)
    }
    pluginManager.withPlugin("com.android.library") {
        configureAndroidProject(androidProject)
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
